<!doctype html>
<html lang="ru" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#080B18">
<title>VELORA</title>
<style>
/* VELORA design system */
:root{
  --bg:#080B18; --bg2:#10162A; --p:#8B5CF6; --p2:#A78BFA; --cyan:#42D9E8; --blue:#477BFF;
  --text:#F5F5FF; --text2:#9BA5C7; --card:rgba(24,30,58,.62); --line:rgba(167,139,250,.18);
  --ok:#4ADE80; --bad:#FB7185; --gold:#FBBF24;
  --r-s:12px; --r-m:18px; --r-l:26px; --sp:16px;
  --shadow:0 10px 30px rgba(0,0,0,.35); --glow:0 0 24px rgba(139,92,246,.45);
  --sat:env(safe-area-inset-top,0px); --sab:env(safe-area-inset-bottom,0px);
  --nav-h:68px;
}
[data-theme="light"]{
  --bg:#F2F3FF; --bg2:#E4E7FA; --text:#12163A; --text2:#566089; --card:rgba(255,255,255,.8);
  --line:rgba(99,102,241,.2); --shadow:0 10px 26px rgba(70,80,160,.18); --glow:0 0 22px rgba(139,92,246,.25);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;overflow-x:hidden;background:var(--bg);color:var(--text);
  font:16px/1.4 -apple-system,"SF Pro Text","Segoe UI",Roboto,system-ui,sans-serif;touch-action:manipulation;overscroll-behavior:none}
#bg{position:fixed;inset:0;z-index:-1;
  background:radial-gradient(900px 500px at 85% -10%,rgba(139,92,246,.35),transparent 60%),
  radial-gradient(700px 500px at -10% 40%,rgba(66,217,232,.18),transparent 60%),
  linear-gradient(180deg,var(--bg),var(--bg2))}
#view{min-height:100%;padding:calc(var(--sat) + 14px) var(--sp) calc(var(--nav-h) + var(--sab) + 24px);max-width:640px;margin:0 auto;animation:fade .35s ease}
#view.nonav{padding-bottom:calc(var(--sab) + 24px)}
@keyframes fade{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
h1{font-size:26px;margin:0 0 4px;letter-spacing:-.3px} h2{font-size:19px;margin:22px 0 10px} h3{font-size:17px;margin:0}
p{margin:0 0 8px} .muted{color:var(--text2)} .row{display:flex;align-items:center;gap:12px} .between{justify-content:space-between}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px} .center{text-align:center}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r-l);padding:16px;box-shadow:var(--shadow);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px)}
.card+.card{margin-top:12px}
.btn{appearance:none;border:0;cursor:pointer;font:600 16px inherit;font-family:inherit;color:#fff;min-height:48px;padding:0 20px;border-radius:var(--r-m);
  background:linear-gradient(135deg,var(--p),var(--blue));box-shadow:var(--glow);transition:transform .12s,filter .2s}
.btn:active{transform:scale(.96)} .btn:disabled{opacity:.45;filter:grayscale(.5);cursor:not-allowed}
.btn.ghost{background:transparent;border:1px solid var(--line);color:var(--text);box-shadow:none}
.btn.cyan{background:linear-gradient(135deg,var(--cyan),var(--blue))} .btn.block{width:100%}
.btn.sm{min-height:40px;padding:0 14px;font-size:14px}
.chip{display:inline-flex;align-items:center;gap:6px;padding:6px 12px;border-radius:99px;background:var(--card);border:1px solid var(--line);font-weight:600;font-size:14px}
.badge{font-size:12px;padding:3px 8px;border-radius:99px;background:rgba(251,191,36,.16);color:var(--gold);font-weight:600}
.bar{height:10px;border-radius:99px;background:rgba(155,165,199,.2);overflow:hidden}
.bar>i{display:block;height:100%;border-radius:inherit;background:linear-gradient(90deg,var(--cyan),var(--p));transition:width .5s}
.top{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:14px}
.avatar{width:48px;height:48px;border-radius:50%;display:grid;place-items:center;font-weight:700;font-size:20px;
  background:linear-gradient(135deg,var(--p),var(--cyan));border:2px solid var(--p2);box-shadow:var(--glow);color:#fff}
.icon{width:24px;height:24px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex:none}
.icon.fill{fill:currentColor;stroke:none}
#nav{position:fixed;left:0;right:0;bottom:0;z-index:20;display:flex;justify-content:space-around;padding:8px 8px calc(var(--sab) + 8px);
  background:rgba(12,16,34,.82);border-top:1px solid var(--line);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px)}
[data-theme="light"] #nav{background:rgba(255,255,255,.85)}
#nav.hidden{display:none}
#nav a{flex:1;max-width:110px;display:flex;flex-direction:column;align-items:center;gap:2px;padding:6px 0;border-radius:14px;color:var(--text2);text-decoration:none;font-size:12px;font-weight:600;transition:.2s}
#nav a.on{color:var(--cyan);background:rgba(139,92,246,.18)}
.game{display:flex;gap:14px;align-items:center;cursor:pointer;position:relative;overflow:hidden}
.game .gi{width:56px;height:56px;border-radius:16px;display:grid;place-items:center;color:#fff;flex:none}
.game[aria-disabled="true"]{opacity:.55;cursor:default}
.opt{display:block;width:100%;text-align:left;margin-top:10px;padding:14px 16px;min-height:52px;border-radius:var(--r-m);border:1px solid var(--line);background:var(--card);color:var(--text);font:600 16px inherit;font-family:inherit;cursor:pointer;transition:.15s}
.opt:active{transform:scale(.98)} .opt.ok{background:rgba(74,222,128,.22);border-color:var(--ok)} .opt.bad{background:rgba(251,113,133,.22);border-color:var(--bad)}
.tabs{display:flex;gap:8px;overflow-x:auto;padding-bottom:4px;scrollbar-width:none} .tabs::-webkit-scrollbar{display:none}
.mem{display:grid;gap:10px}
.tile{aspect-ratio:1;border-radius:16px;border:1px solid var(--line);background:linear-gradient(145deg,#1b2245,#10162A);display:grid;place-items:center;cursor:pointer;transition:transform .3s;color:transparent}
.tile.open,.tile.done{background:var(--card);transform:rotateY(0)} .tile.done{border-color:var(--ok);box-shadow:0 0 14px rgba(74,222,128,.4)}
.key{min-width:34px;height:44px;border-radius:10px;border:1px solid var(--line);background:var(--card);color:var(--text);font:700 16px inherit;font-family:inherit}
.key:disabled{opacity:.3}
.keys{display:flex;flex-wrap:wrap;gap:6px;justify-content:center;margin-top:14px}
.word{display:flex;gap:8px;justify-content:center;margin:18px 0}
.word b{width:34px;height:44px;border-bottom:3px solid var(--p2);display:grid;place-items:center;font-size:24px}
.reactpad{height:280px;border-radius:var(--r-l);display:grid;place-items:center;font-size:22px;font-weight:700;text-align:center;padding:16px;user-select:none;transition:background .1s}
.modal-bg{position:fixed;inset:0;background:rgba(0,0,0,.6);z-index:50;display:grid;place-items:end center;animation:fade .2s}
.sheet{width:100%;max-width:640px;background:var(--bg2);border-radius:var(--r-l) var(--r-l) 0 0;padding:20px 16px calc(var(--sab) + 20px);border:1px solid var(--line)}
#toast{position:fixed;left:50%;top:calc(var(--sat) + 14px);transform:translate(-50%,-80px);z-index:60;background:var(--bg2);border:1px solid var(--p2);padding:10px 18px;border-radius:99px;font-weight:600;transition:transform .35s;max-width:90%}
#toast.show{transform:translate(-50%,0)}
.lumi{animation:float 3.6s ease-in-out infinite} @keyframes float{50%{transform:translateY(-8px)}}
.seg{display:flex;background:var(--card);border:1px solid var(--line);border-radius:99px;padding:4px;gap:4px}
.seg button{flex:1;min-height:40px;border:0;border-radius:99px;background:none;color:var(--text2);font:600 14px inherit;font-family:inherit}
.seg button.on{background:linear-gradient(135deg,var(--p),var(--blue));color:#fff}
input[type=range]{width:100%;accent-color:var(--p)}
input[type=text]{width:100%;min-height:48px;border-radius:var(--r-m);border:1px solid var(--line);background:var(--card);color:var(--text);padding:0 14px;font:16px inherit;font-family:inherit}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
.tile2{display:flex;flex-direction:column;align-items:center;gap:6px;margin:0!important;padding:14px 8px;text-decoration:none;color:var(--text);transition:transform .15s}
.tile2:active{transform:scale(.96)} .tile2 .icon{width:30px;height:30px;color:var(--cyan)}
.hero{border-color:rgba(167,139,250,.35);box-shadow:0 14px 40px rgba(139,92,246,.3)}
.game{transition:transform .15s,box-shadow .2s} .game:active{transform:scale(.98)}
.card.game{background:linear-gradient(135deg,rgba(139,92,246,.18),rgba(24,30,58,.7))}
#nav a.on{box-shadow:0 0 18px rgba(139,92,246,.45) inset}
#nav a.on .icon{filter:drop-shadow(0 0 6px var(--cyan))}
.shopitem{transition:transform .15s} .shopitem:active{transform:scale(.97)}
.btn{background-size:200% 100%;position:relative;overflow:hidden}
.btn:not(.ghost)::after{content:"";position:absolute;inset:0;background:linear-gradient(105deg,transparent 40%,rgba(255,255,255,.25) 50%,transparent 60%);transform:translateX(-120%);animation:shine 4s infinite}
@keyframes shine{60%,100%{transform:translateX(120%)}}
button.chip{color:var(--text);font-family:inherit;cursor:pointer}
.podium{display:flex;align-items:flex-end;justify-content:center;gap:8px;margin:18px 0 14px;padding:8px 0 0;background:radial-gradient(260px 120px at 50% 100%,rgba(139,92,246,.35),transparent 70%)}
.pl{flex:1;max-width:120px;display:flex;flex-direction:column;align-items:center;gap:4px}
.pav{width:54px;height:54px;border-radius:50%;display:grid;place-items:center;font-weight:700;font-size:22px;background:#1b2245;border:3px solid var(--p2);box-shadow:var(--glow);color:#fff}
.pl.p1 .pav{width:66px;height:66px;font-size:26px;border-color:var(--gold)}
.pn{font-size:13px;font-weight:600;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pb{width:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;border-radius:12px 12px 0 0;background:linear-gradient(180deg,#232b55,#10162A);border-top:4px solid var(--p);box-shadow:0 -6px 20px rgba(139,92,246,.35)}
.pb i{font-style:normal;font-size:34px;font-weight:800;color:var(--p2)} .pb small{color:var(--text2);font-size:12px;margin-bottom:6px}
.p1 .pb{height:120px}.p2 .pb{height:92px}.p3 .pb{height:72px}
.chip{white-space:nowrap}
/* ---- results & intro polish ---- */
.intro-hero{text-align:center;padding-top:6px}
.intro-cover{display:inline-block;filter:drop-shadow(0 12px 28px rgba(139,92,246,.55));animation:float 4s ease-in-out infinite;margin-bottom:8px}
.res{position:relative}
.res-glow{position:absolute;left:50%;top:-10px;width:300px;height:300px;margin-left:-150px;border-radius:50%;background:radial-gradient(circle,rgba(139,92,246,.35),transparent 65%);z-index:-1;animation:pulse 3s ease-in-out infinite}
.res-glow.w{background:radial-gradient(circle,rgba(251,191,36,.38),transparent 65%)}
@keyframes pulse{50%{transform:scale(1.12);opacity:.7}}
.ring{position:relative;display:grid;place-items:center}
.ring svg{position:absolute;inset:0;filter:drop-shadow(0 0 10px rgba(66,217,232,.45))}
.ring-arc{animation:arc 1.2s .15s cubic-bezier(.2,.8,.2,1) forwards}
@keyframes arc{to{stroke-dashoffset:var(--to)}}
.ring-t{position:relative;display:flex;flex-direction:column;line-height:1.1}.ring-t b{font-size:30px}.ring-t span{font-size:12px;color:var(--text2)}
.rv{font-size:26px;background:linear-gradient(135deg,var(--cyan),var(--p2));-webkit-background-clip:text;background-clip:text;color:transparent}
.res-r>div{animation:pop .5s both}.res-r>div+div{animation-delay:.12s}
@keyframes pop{from{opacity:0;transform:scale(.7)}to{opacity:1;transform:none}}
.lvl-up{animation:pop .6s .6s both,shine2 2s 1s infinite}@keyframes shine2{50%{box-shadow:0 0 18px rgba(251,191,36,.6)}}
.confetti{position:fixed;inset:0;pointer-events:none;overflow:hidden;z-index:50}
.confetti i{position:absolute;top:-20px;border-radius:2px;animation:fall linear forwards}
@keyframes fall{to{transform:translate(var(--dx),105vh) rotate(var(--r));opacity:.9}}
@media (prefers-reduced-motion:reduce){.confetti,.res-glow,.intro-cover,.lumi{animation:none!important}}
/* ---- game screens ---- */
.opt{display:flex;align-items:center;gap:12px;animation:slideIn .4s both;transition:transform .15s,background .2s,border-color .2s}
@keyframes slideIn{from{opacity:0;transform:translateX(-18px)}to{opacity:1;transform:none}}
.ol{flex:none;width:30px;height:30px;border-radius:10px;display:grid;place-items:center;font-size:14px;font-weight:800;background:linear-gradient(135deg,var(--p),var(--blue));color:#fff}
.opt.ok .ol{background:var(--ok)}.opt.bad .ol{background:var(--bad)}
.opt.ok{animation:okpulse .5s}.opt.bad{animation:shake .4s}
@keyframes okpulse{40%{transform:scale(1.03);box-shadow:0 0 22px rgba(74,222,128,.55)}}
@keyframes shake{25%{transform:translateX(-7px)}75%{transform:translateX(7px)}}
#tb.low{background:linear-gradient(90deg,var(--bad),var(--gold))}
.combo{color:var(--gold);font-weight:700}
.tile{position:relative;perspective:600px;background:linear-gradient(145deg,#2a2468,#141a3a)}
.tile::before{content:"";position:absolute;inset:0;border-radius:inherit;opacity:.5;background:radial-gradient(circle at 50% 50%,rgba(66,217,232,.5) 0 3px,transparent 4px),repeating-linear-gradient(45deg,transparent 0 8px,rgba(167,139,250,.14) 8px 9px)}
.tile.open::before,.tile.done::before{display:none}
.tile.flip{animation:flip .35s ease}
@keyframes flip{from{transform:rotateY(90deg) scale(.9)}to{transform:none}}
.tile.done{animation:matched .5s}
@keyframes matched{40%{transform:scale(1.14)}}
.reactpad{position:relative;overflow:hidden;box-shadow:inset 0 0 60px rgba(0,0,0,.35)}
.reactpad[data-s=go]{animation:gopulse .5s infinite alternate;font-size:34px}
.reactpad[data-s=hit]{font-size:44px}
.reactpad[data-s=foul]{animation:shake .4s}
@keyframes gopulse{to{box-shadow:inset 0 0 90px rgba(255,255,255,.4)}}
.rip{position:absolute;width:20px;height:20px;margin:-10px;border-radius:50%;border:3px solid #fff;pointer-events:none;animation:rip .7s ease-out forwards}
@keyframes rip{to{transform:scale(18);opacity:0}}
/* ---- shop & world ---- */
.tryon{position:relative;display:flex;align-items:center;justify-content:center;gap:18px;border-radius:var(--r-l);padding:16px;margin-bottom:12px;overflow:hidden;border:1px solid var(--line);box-shadow:var(--shadow)}
.tryon-glow{position:absolute;inset:0;background:radial-gradient(200px 120px at 50% 100%,rgba(255,255,255,.25),transparent 70%)}
.tryon>*{position:relative}
.shopitem{position:relative}
.rtag{position:absolute;top:8px;left:8px;font-size:11px;font-weight:700;padding:2px 8px;border-radius:99px;background:rgba(155,165,199,.2);color:var(--text2)}
.r-rare{border-color:var(--cyan);box-shadow:0 0 16px rgba(66,217,232,.3)}.r-rare .rtag{background:rgba(66,217,232,.18);color:var(--cyan)}
.r-epic{border-color:var(--p2);box-shadow:0 0 22px rgba(167,139,250,.5);background:linear-gradient(160deg,rgba(139,92,246,.28),var(--card))}.r-epic .rtag{background:rgba(167,139,250,.25);color:var(--p2)}
.terr.open{border-color:rgba(66,217,232,.45);box-shadow:0 0 22px rgba(66,217,232,.18)}
.dq{background:linear-gradient(135deg,rgba(251,191,36,.16),var(--card))}
/* ---- multiplayer ---- */
.roomcode{font-size:44px;font-weight:800;letter-spacing:10px;margin:6px 0;background:linear-gradient(135deg,var(--cyan),var(--p2));-webkit-background-clip:text;background-clip:text;color:transparent;cursor:pointer;padding-left:10px}
.slots{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.slot{display:flex;flex-direction:column;align-items:center;gap:6px;padding:14px 8px;border-radius:var(--r-m);border:1px dashed var(--line);text-align:center;min-height:112px;justify-content:center}
.slot.on{border-style:solid;background:var(--card)}
.pav.pulse{animation:pulse 1.6s ease-in-out infinite;opacity:.6}
.vs{padding-top:30px}.vsrow{display:flex;align-items:center;justify-content:space-around;margin:28px 0}
.vsp{display:flex;flex-direction:column;align-items:center;gap:6px;margin-bottom:10px;animation:pop .6s both}
.vsx{font-size:44px;font-weight:900;background:linear-gradient(135deg,var(--gold),var(--bad));-webkit-background-clip:text;background-clip:text;color:transparent;animation:pop .8s .3s both}
.sb{padding:10px 14px}
.sbrow{display:flex;align-items:center;gap:8px;padding:4px 0}.sbrow.me .sbn{font-weight:700}
.sbn{min-width:64px;max-width:90px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:14px}
.dot{width:10px;height:10px;border-radius:50%;flex:none}
/* ---- Welcome & legal ---- */
.welcome{--bg:#080B18;--bg2:#10162A;--text:#F5F5FF;--text2:#9BA5C7;--card:rgba(24,30,58,.72);--line:rgba(167,139,250,.22);--shadow:0 10px 30px rgba(0,0,0,.35);
  position:fixed;inset:0;z-index:90;display:flex;flex-direction:column;background:#080B18;color:var(--text);height:100vh;height:100dvh;animation:wfade .45s ease;overflow:hidden}
.welcome.out{animation:wout .26s ease forwards}
@keyframes wfade{from{opacity:0}to{opacity:1}} @keyframes wout{to{opacity:0;transform:scale(1.03)}}
html.welcome-open,html.welcome-open body{overflow:hidden}
.w-glow{position:absolute;border-radius:50%;filter:blur(60px);pointer-events:none;opacity:.55}
.w-glow.a{width:300px;height:300px;right:-90px;top:-80px;background:rgba(139,92,246,.55);animation:pulse 6s ease-in-out infinite}
.w-glow.b{width:260px;height:260px;left:-100px;top:38%;background:rgba(66,217,232,.3);animation:pulse 7s 1s ease-in-out infinite}
.w-scroll{position:relative;flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;overscroll-behavior:contain;padding:calc(var(--sat) + 18px) 16px 12px}
.w-in{max-width:560px;margin:0 auto}
.w-head{text-align:center;margin-bottom:14px}.w-logo{display:flex;justify-content:center;margin-bottom:2px}
.w-lumi{display:flex;justify-content:center;margin:2px 0 -4px;filter:drop-shadow(0 8px 22px rgba(139,92,246,.6))}
.w-head h1{font-size:26px;margin:4px 0 4px}
.doccard{display:flex;align-items:center;gap:12px;width:100%;text-align:left;margin:0 0 10px!important;padding:13px 14px;color:var(--text);font:inherit;text-decoration:none;cursor:pointer;animation:slideIn .45s both;transition:transform .15s,border-color .2s}
button.doccard{border:1px solid var(--line);background:var(--card);border-radius:var(--r-l)}
.doccard:active{transform:scale(.98)} .doccard:hover{border-color:var(--p2)}
.doccard .icon{width:22px;height:22px;color:var(--text2)}
.di{flex:none;width:44px;height:44px;border-radius:14px;display:grid;place-items:center;background:linear-gradient(135deg,rgba(139,92,246,.35),rgba(66,217,232,.22));box-shadow:0 0 16px rgba(139,92,246,.3)}
.di .icon{color:var(--cyan)!important}
.w-ok .icon{color:var(--ok)!important}
.w-foot{position:relative;padding:12px 16px calc(var(--sab) + 14px);background:rgba(10,14,32,.88);border-top:1px solid var(--line);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px)}
.w-foot>*{max-width:560px;margin-left:auto;margin-right:auto}
.w-check{display:flex;align-items:center;gap:12px;margin-bottom:12px;cursor:pointer;font-size:15px;line-height:1.3;-webkit-user-select:none;user-select:none}
.w-check input{position:absolute;opacity:0;width:1px;height:1px}
.w-check .box{flex:none;width:30px;height:30px;border-radius:10px;border:2px solid var(--p2);display:grid;place-items:center;transition:.2s;background:rgba(139,92,246,.1)}
.w-check .box .icon{width:18px;height:18px;opacity:0;transform:scale(.4);transition:.2s;color:#fff}
.w-check input:checked+.box{background:linear-gradient(135deg,var(--p),var(--cyan));border-color:transparent;box-shadow:0 0 16px rgba(66,217,232,.5)}
.w-check input:checked+.box .icon{opacity:1;transform:none}
.w-check input:focus-visible+.box{outline:2px solid var(--cyan);outline-offset:2px}
.w-foot .btn{letter-spacing:.6px}
.legal{padding:16px}.legal .ld+.ld{margin-top:16px}
.legal h3{font-size:16px;margin:0 0 6px;color:var(--cyan)} .legal p{font-size:15px;line-height:1.5;margin:0 0 8px;color:var(--text)}
.legal ul{margin:0 0 6px;padding-left:20px}.legal li{font-size:15px;line-height:1.5;margin-bottom:4px}
.doccard .di+div b{font-size:16px}
.w-head h1{font-size:23px;margin:0 0 2px}.w-head p{font-size:14px;margin:0}
.w-scroll{padding-top:calc(var(--sat) + 12px)}
.doccard{padding:11px 13px;gap:11px}.doccard .muted{font-size:13px;line-height:1.3}.doccard b{font-size:15px;line-height:1.25}
.di{width:40px;height:40px;border-radius:12px}
@media (max-height:640px){.w-lumi{display:none}.w-head h1{font-size:21px}}


/* ===== VELORA 1.5 PREMIUM UI — design system v2 (поверх существующих классов) ===== */
:root:not([data-theme="light"]){--card:rgba(20,21,46,.82);--card2:#14152E;--line:rgba(139,92,246,.3);--r-l:22px;--r-m:16px;--shadow:0 12px 30px rgba(3,4,14,.55)}
:root:not([data-theme="light"]) .card{background:linear-gradient(160deg,rgba(26,27,58,.86),rgba(18,19,42,.82));box-shadow:var(--shadow),inset 0 1px 0 rgba(255,255,255,.06)}
.btn{background:linear-gradient(135deg,#9B6CFF,#6D5BFF 55%,var(--blue));box-shadow:0 8px 22px rgba(109,91,255,.45),inset 0 1px 0 rgba(255,255,255,.28);transition:transform .15s,box-shadow .2s}
.btn:active{transform:scale(.97)}
.bar{height:9px;background:rgba(155,165,199,.16)}
.bar i{display:block;height:100%;border-radius:99px;background:linear-gradient(90deg,var(--p),var(--cyan));box-shadow:0 0 10px rgba(66,217,232,.55);transition:width .9s cubic-bezier(.2,.8,.2,1)}
.bar.sm{height:6px}
h2{display:flex;align-items:center;gap:8px;font-size:17px;letter-spacing:.2px}
h2::before{content:"";width:4px;height:16px;border-radius:4px;background:linear-gradient(var(--cyan),var(--p))}
#nav{margin:0 10px calc(var(--sab) + 8px);left:0;right:0;border:1px solid var(--line);border-radius:26px;background:rgba(14,16,36,.86);box-shadow:0 10px 34px rgba(0,0,0,.55),0 0 24px rgba(139,92,246,.18);padding:6px}
#nav a{border-radius:20px;padding:7px 0;transition:.25s}
#nav a.on{background:linear-gradient(180deg,rgba(139,92,246,.34),rgba(66,217,232,.12));box-shadow:0 0 16px rgba(139,92,246,.45) inset,0 0 14px rgba(139,92,246,.3)}
/* home: header */
.hd{display:flex;align-items:center;gap:12px;margin-bottom:10px}
.hd .av{position:relative;flex:none;border-radius:50%;padding:2px;background:linear-gradient(135deg,var(--p),var(--cyan));box-shadow:0 0 18px rgba(139,92,246,.6)}
.hd .av>*{display:block}
.hd .lv{position:absolute;left:50%;bottom:-8px;transform:translateX(-50%);font-size:10px;font-weight:800;padding:1px 7px;border-radius:99px;background:linear-gradient(135deg,var(--p),var(--blue));border:1px solid rgba(255,255,255,.3);white-space:nowrap}
.hd-main{flex:1;min-width:0}.hd-name{font-weight:800;font-size:17px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.hd-xp{font-size:11px;color:var(--text2);margin:1px 0 4px}
.hd-cur{display:flex;flex-direction:column;gap:5px}
.pill{display:flex;align-items:center;gap:6px;justify-content:flex-end;padding:4px 10px;border-radius:99px;font-weight:800;font-size:14px;background:rgba(10,12,30,.7);border:1px solid var(--line)}
.pill.cy{color:var(--cyan)}.pill.go{color:var(--gold)}.pill .icon{width:16px;height:16px}
.gear{flex:none;display:grid;place-items:center;width:38px;height:38px;border-radius:50%;border:1px solid var(--line);background:rgba(10,12,30,.6);color:var(--text2)}
.streak{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--text2);margin:14px 2px 12px}
.streak .icon{width:18px;height:18px;color:var(--gold)}.streak a{margin-left:auto;color:var(--cyan);font-weight:700;text-decoration:none}
/* home: season banner */
.banner{position:relative;height:208px;border-radius:24px;overflow:hidden;border:1px solid rgba(167,139,250,.45);background:linear-gradient(135deg,#3a1d8f,#1b1f5e 60%,#0f2a5a);box-shadow:0 16px 40px rgba(109,91,255,.35)}
.banner .bn-bg svg{position:absolute;inset:0;width:100%;height:100%;opacity:.85}
.banner::after{content:"";position:absolute;inset:0;background:linear-gradient(90deg,rgba(8,11,24,.78),rgba(8,11,24,.1) 70%)}
.bn-txt{position:absolute;z-index:2;left:16px;top:16px;bottom:16px;width:58%;display:flex;flex-direction:column;justify-content:center;gap:4px}
.eyebrow{font-size:12px;font-weight:800;letter-spacing:.14em;color:var(--cyan)}
.bt{font-size:23px;line-height:1.05;font-weight:900;letter-spacing:.02em;text-transform:uppercase;text-shadow:0 2px 14px rgba(139,92,246,.9)}
.bn-lumi{position:absolute;z-index:2;right:-6px;bottom:-10px;filter:drop-shadow(0 0 22px rgba(66,217,232,.55))}
.bn-txt .btn{min-height:38px;font-size:14px;padding:0 14px;margin-top:6px;align-self:flex-start;display:inline-grid;place-items:center;text-decoration:none}
.spark{position:absolute;z-index:1;width:5px;height:5px;border-radius:50%;background:#fff;box-shadow:0 0 10px 2px var(--cyan);animation:tw 3s ease-in-out infinite}
.spark.s1{left:62%;top:22%}.spark.s2{left:78%;top:12%;animation-delay:.8s}.spark.s3{left:90%;top:48%;animation-delay:1.6s}
@keyframes tw{0%,100%{opacity:.15;transform:scale(.6)}50%{opacity:1;transform:scale(1.2)}}
/* home: 3-column tiles */
.tiles3{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:14px}
.tile3{display:flex;flex-direction:column;align-items:center;gap:7px;padding:12px 4px 10px;border-radius:20px;text-decoration:none;color:var(--text);font-weight:700;font-size:12.5px;border:1px solid var(--line);background:linear-gradient(160deg,rgba(32,30,74,.85),rgba(16,18,40,.85));box-shadow:0 8px 20px rgba(3,4,14,.45),inset 0 1px 0 rgba(255,255,255,.06);transition:transform .15s}
.tile3:active{transform:scale(.95)}
.tile3 .ti{display:grid;place-items:center;width:46px;height:46px;border-radius:15px;background:radial-gradient(circle at 30% 25%,rgba(66,217,232,.5),rgba(139,92,246,.35) 60%,rgba(71,123,255,.25));box-shadow:0 0 16px rgba(139,92,246,.45);color:#fff}
.tile3 .ti .icon{width:26px;height:26px;filter:drop-shadow(0 0 5px rgba(66,217,232,.8))}
/* entrance animation */
.rise>*{animation:rise .5s cubic-bezier(.2,.8,.2,1) both}
.rise>*:nth-child(2){animation-delay:.05s}.rise>*:nth-child(3){animation-delay:.1s}.rise>*:nth-child(4){animation-delay:.15s}.rise>*:nth-child(5){animation-delay:.2s}.rise>*:nth-child(n+6){animation-delay:.25s}
@keyframes rise{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){.rise>*,.spark{animation:none!important}}

.icon.coin-img{object-fit:contain;filter:drop-shadow(0 0 4px rgba(255,190,60,.55))}
.lumi{max-width:100%}

.icon.gem-img{object-fit:contain;filter:drop-shadow(0 0 4px rgba(110,150,255,.55))}
.banner .bn-bg img{position:absolute;inset:0;width:100%!important;height:100%!important;object-fit:cover;opacity:.92}

<div id="bg" aria-hidden="true"></div>

<script>
(() => {
const __m = {};
// ===== ASSETS: PNG-картинки из репозитория (рядом с index.html). Если файл не найден — работает прежняя векторная графика. =====
const ASSET_BASES = ['assets/'];
const ASSET_SUBS = { lumi: ['characters/lumi/'], icons: ['icons/currency/'], items: ['icons/items/'], resources: ['icons/resources/'], frames: ['frames/profiles/'], badges: ['icons/achievements/'],
  backgrounds: ['backgrounds/main/'], banners: ['banners/main/', 'banners/events/', 'banners/season/', 'banners/promotions/'], worlds: ['banners/worlds/'], games: ['games/'], cards: ['cards/characters/', 'cards/items/'] };
const ASSET_FB = {};
const ASSET_WIN = (() => { try { return JSON.parse(localStorage.getItem('velora_assets2') || '{}'); } catch (e) { return {}; } })();
const assetCands = (c, f) => { const l = []; if (ASSET_WIN[c]) l.push(ASSET_WIN[c] + f); for (const b of ASSET_BASES) for (const s of (ASSET_SUBS[c] || [''])) l.push(b + s + f); return [...new Set(l)]; };
const assetImg = (c, f, attrs, fb) => { const u = assetCands(c, f)[0]; return `<img ${attrs} src="${u}" data-ac="${c}" data-af="${f}" data-at="${u}" data-fb="${fb}" decoding="async">`; };
document.addEventListener('error', e => {
  const t = e.target; if (!t || t.tagName !== 'IMG' || !t.dataset.ac) return;
  const tried = (t.dataset.at || '').split('|'), next = assetCands(t.dataset.ac, t.dataset.af).find(u => !tried.includes(u));
  if (next) { t.dataset.at = tried.concat(next).join('|'); t.src = next; return; }
  const [kind, ...args] = (t.dataset.fb || '').split(':'), f = ASSET_FB[kind]; if (f) t.outerHTML = f(...args);
}, true);
document.addEventListener('load', e => {
  const t = e.target; if (!t || t.tagName !== 'IMG' || !t.dataset.ac) return;
  const u = t.getAttribute('src') || '', pre = u.slice(0, u.length - t.dataset.af.length);
  if (u.endsWith(t.dataset.af) && ASSET_WIN[t.dataset.ac] !== pre) { ASSET_WIN[t.dataset.ac] = pre; try { localStorage.setItem('velora_assets2', JSON.stringify(ASSET_WIN)); } catch (err) { /* cache only */ } }
}, true);

__m["services/telegram"] = (() => {
const __exp = {};
// Telegram Mini Apps wrapper with safe browser fallback.
// NOTE: user data from initDataUnsafe is for display only. Server must verify initData (see supabase/functions, stage 7).
const tg = window.Telegram?.WebApp;
const inTelegram = !!(tg && tg.initData);

function initTelegram() {
  if (!tg) return;
  try {
    tg.ready(); tg.expand();
    tg.setHeaderColor?.('#080B18'); tg.setBackgroundColor?.('#080B18');
    tg.disableVerticalSwipes?.();
  } catch (e) { console.warn('tg init', e); }
}

function tgUser() {
  const u = tg?.initDataUnsafe?.user;
  return u ? { id: String(u.id), name: u.first_name || u.username || 'Игрок' } : null;
}
function tgColorScheme() { return inTelegram ? tg.colorScheme : null; }
function startParam() { return tg?.initDataUnsafe?.start_param || new URLSearchParams(location.search).get('start') || ''; }

function haptic(type = 'light') {
  try {
    const h = tg?.HapticFeedback; if (!h) return;
    if (type === 'success' || type === 'error' || type === 'warning') h.notificationOccurred(type);
    else h.impactOccurred(type);
  } catch {}
}

let backHandler = null;
function setBack(fn) {
  const bb = tg?.BackButton;
  if (backHandler && bb) bb.offClick(backHandler);
  backHandler = fn;
  if (!bb) return;
  if (fn) { bb.onClick(fn); bb.show(); } else bb.hide();
}
const initDataRaw = () => tg?.initData || '';
const openInvoice = url => new Promise(res => { try { if (!tg?.openInvoice) return res('unsupported'); tg.openInvoice(url, st => res(st)); } catch { res('failed'); } });

Object.assign(__exp, { inTelegram, initTelegram, tgUser, tgColorScheme, startParam, haptic, setBack, initDataRaw, openInvoice });
return __exp;
})();

__m["services/store"] = (() => {
const __exp = {};
// Local demo store. In production all balances/XP are computed server-side (Supabase RPC) — see README.
const KEY = 'velora.v1';
const day = () => new Date().toISOString().slice(0, 10);

const def = () => ({
  id: 'V-' + Math.random().toString(36).slice(2, 8).toUpperCase(),
  nick: 'Игрок', created: Date.now(), xp: 0, coins: 100, crystals: 5,
  streak: 0, lastVisit: '', history: [], stats: {}, claimed: {}, daily: {},
  settings: { music: false, sfx: true, volume: 0.6, theme: 'dark' }
});

let s;
try { s = { ...def(), ...JSON.parse(localStorage.getItem(KEY) || '{}') }; } catch { s = def(); }
s.settings = { ...def().settings, ...s.settings };
const subs = new Set();
const save = () => { try { localStorage.setItem(KEY, JSON.stringify(s)); } catch {} subs.forEach(f => f()); };

const state = () => s;
const onChange = f => { subs.add(f); return () => subs.delete(f); };
const need = lvl => 100 + (lvl - 1) * 50;
function levelInfo() {
  let xp = s.xp, lvl = 1;
  while (xp >= need(lvl)) { xp -= need(lvl); lvl++; }
  return { level: lvl, cur: xp, max: need(lvl), pct: Math.round(xp / need(lvl) * 100) };
}
function setNick(n) { n = String(n).trim().slice(0, 16); if (n) { s.nick = n; save(); } }
function setSetting(k, v) { s.settings[k] = v; save(); }

function touchVisit() {
  const t = day();
  if (s.lastVisit === t) return;
  const y = new Date(Date.now() - 864e5).toISOString().slice(0, 10);
  s.streak = s.lastVisit === y ? s.streak + 1 : 1;
  s.lastVisit = t; save();
}

function playedToday() { return s.daily[day()]?.played || 0; }
const DAILY = { goal: 3, coins: 50, crystals: 1 };
const dailyClaimed = () => !!s.claimed[day()];
function claimDaily() {
  if (dailyClaimed() || playedToday() < DAILY.goal) return false;
  s.claimed[day()] = true; s.coins += DAILY.coins; s.crystals += DAILY.crystals; save(); return true;
}

// Reward formula (demo). Capped per game so clients cannot inflate it once moved to server.
function recordGame({ mode, score, max, win, diff }) {
  const mult = { easy: 1, normal: 1.5, hard: 2 }[diff] || 1;
  const ratio = max ? Math.min(1, score / max) : 0;
  const xp = Math.round((10 + 30 * ratio) * mult);
  const coins = win ? Math.round(10 * mult + 10 * ratio) : Math.round(3 * ratio);
  const before = levelInfo().level;
  s.xp += xp; s.coins += coins;
  const lvlUp = levelInfo().level > before;
  if (lvlUp) s.coins += 25;
  const st = (s.stats[mode] ||= { played: 0, wins: 0, best: 0 });
  st.played++; if (win) st.wins++; st.best = Math.max(st.best, score);
  const d = (s.daily[day()] ||= { played: 0 }); d.played++;
  s.history.unshift({ mode, score, max, win, diff, xp, coins, t: Date.now() });
  s.history.length = Math.min(s.history.length, 50);
  save();
  return { xp, coins, lvlUp };
}
const totals = () => {
  const v = Object.entries(s.stats);
  return {
    played: v.reduce((a, [, x]) => a + x.played, 0), wins: v.reduce((a, [, x]) => a + x.wins, 0),
    fav: v.sort((a, b) => b[1].played - a[1].played)[0]?.[0] || null
  };
};

// ---- Shop / inventory / achievements (demo, local). Server-side RPCs replace these in stage 7. ----
s.owned ||= []; s.equipped ||= {}; s.tx ||= []; s.ach ||= {};
const SHOP = [
  { id: 'fr_aurora', kind: 'frame', name: 'Рамка «Аврора»', c: ['#42D9E8', '#8B5CF6'], price: 60, cur: 'coins' },
  { id: 'fr_sun', kind: 'frame', name: 'Рамка «Рассвет»', c: ['#FBBF24', '#FB7185'], price: 90, cur: 'coins' },
  { id: 'fr_void', kind: 'frame', name: 'Рамка «Бездна»', c: ['#477BFF', '#10162A'], price: 8, cur: 'crystals' },
  { id: 'bg_night', kind: 'bg', name: 'Фон «Ночной лес»', c: ['#0f766e', '#1e1b4b'], price: 80, cur: 'coins' },
  { id: 'bg_dusk', kind: 'bg', name: 'Фон «Закат»', c: ['#f97316', '#7c3aed'], price: 120, cur: 'coins' },
  { id: 'bg_ice', kind: 'bg', name: 'Фон «Ледяной купол»', c: ['#67e8f9', '#3b82f6'], price: 10, cur: 'crystals' },
  { id: 'sk_mint', kind: 'skin', name: 'Луми «Мята»', c: ['#6ee7b7', '#0ea5e9'], price: 150, cur: 'coins', hue: 120 },
  { id: 'sk_rose', kind: 'skin', name: 'Луми «Роза»', c: ['#f9a8d4', '#a855f7'], price: 150, cur: 'coins', hue: 300 },
  { id: 'sk_sun', kind: 'skin', name: 'Луми «Солнце»', c: ['#fde047', '#f97316'], price: 12, cur: 'crystals', hue: 190 },
  { id: 'fr_crystal', kind: 'frame', name: 'Рамка «Кристалл»', c: ['#42D9E8', '#8B5CF6'], price: 0, cur: 'coins', season: true },
  { id: 'bg_crystal', kind: 'bg', name: 'Фон «Кристальная пещера»', c: ['#0e7490', '#4c1d95'], price: 0, cur: 'coins', season: true },
  { id: 'sk_crystal', kind: 'skin', name: 'Луми «Кристалл»', c: ['#67e8f9', '#a78bfa'], price: 0, cur: 'coins', hue: 215, season: true }
];
const KINDS = { frame: 'Рамки', bg: 'Фоны', skin: 'Образы Луми' };
const item = id => SHOP.find(i => i.id === id);
const owns = id => s.owned.includes(id);
function buy(id) {
  const it = item(id); if (!it) return 'Предмет не найден';
  if (owns(id)) return 'Уже куплено';
  if (s[it.cur] < it.price) return 'Не хватает ' + (it.cur === 'coins' ? 'монет' : 'кристаллов');
  s[it.cur] -= it.price; s.owned.push(id);
  s.tx.unshift({ t: Date.now(), d: -it.price, cur: it.cur, why: it.name }); s.tx.length = Math.min(s.tx.length, 50);
  save(); return null;
}
function equip(id) {
  const it = item(id); if (!it || !owns(id)) return;
  s.equipped[it.kind] = s.equipped[it.kind] === id ? null : id; save();
}
const equippedItem = kind => item(s.equipped[kind]);

const ACH = [
  ['first', 'Первый шаг', 'Сыграй первую игру', () => totals().played >= 1, 20],
  ['play10', 'Игроман', 'Сыграй 10 игр', () => totals().played >= 10, 40],
  ['win5', 'Чемпион', 'Одержи 5 побед', () => totals().wins >= 5, 50],
  ['streak3', 'В ритме', 'Серия 3 дня подряд', () => s.streak >= 3, 40],
  ['lvl5', 'Опытный', 'Достигни 5 уровня', () => levelInfo().level >= 5, 60],
  ['rich', 'Копилка', 'Накопи 300 монет', () => s.coins >= 300, 30],
  ['fast', 'Молния', 'Реакция быстрее 300 мс (в среднем)', () => (s.stats.reaction?.best || 0) >= 260, 50],
  ['all', 'Исследователь', 'Попробуй все 7 игр', () => Object.keys(s.stats).filter(k => k !== 'daily').length >= 7, 70]
].map(([id, name, desc, test, reward]) => ({ id, name, desc, test, reward }));
// Grants rewards once per achievement. Returns newly unlocked list.
function checkAchievements() {
  const fresh = [];
  for (const a of ACH) if (!s.ach[a.id] && a.test()) { s.ach[a.id] = Date.now(); s.coins += a.reward; s.tx.unshift({ t: Date.now(), d: a.reward, cur: 'coins', why: 'Достижение: ' + a.name }); fresh.push(a); }
  if (fresh.length) save(); return fresh;
}

// Server is the source of truth when online: overwrite local mirror.
function applyServer(p, owned, ach) {
  if (p) { s.nick = p.nickname; s.xp = p.xp; s.coins = p.coins; s.crystals = p.crystals; s.streak = p.streak; s.equipped = p.equipped || {}; }
  if (owned) s.owned = owned;
  if (ach) s.ach = ach;
  save();
}

// Legal documents acceptance (local mirror; the server record in terms_acceptances is the reliable one).

async function login() {
  const r = await fetch(base() + '/functions/v1/' + (CONFIG.AUTH_FUNCTION || 'telegram-auth'), {
    method: 'POST', headers: { 'Content-Type': 'application/json', apikey: CONFIG.SUPABASE_ANON_KEY },
    body: JSON.stringify({ initData: initDataRaw() })
  });
  const j = await r.json().catch(() => ({}));
  if (!r.ok) throw new Error((j.error || 'auth_failed') + (j.detail ? ': ' + j.detail : ''));
  token = j.token; expAt = Date.now() + (j.expires_in - 60) * 1000; myId = j.profile_id;
}
async function call(path, init = {}) {
  if (!token || Date.now() > expAt) await login();
  const r = await fetch(base() + path, { ...init, headers: { apikey: CONFIG.SUPABASE_ANON_KEY, Authorization: 'Bearer ' + token, 'Content-Type': 'application/json', ...(init.headers || {}) } });
  const text = await r.text(); let j = null; try { j = text ? JSON.parse(text) : null; } catch { j = text; }
  if (!r.ok) throw new Error(j?.message || j?.error || 'http_' + r.status);
  return j;
}
const rpc = (name, args = {}) => call('/rest/v1/rpc/' + name, { method: 'POST', body: JSON.stringify(args) });

async function syncAll() {
  const [p, inv, ua] = await Promise.all([
    call('/rest/v1/profiles?select=nickname,xp,coins,crystals,streak,equipped&id=eq.' + myId),
    call('/rest/v1/inventory?select=item_id'), call('/rest/v1/user_achievements?select=achievement_id,unlocked_at')]);
  S.applyServer(p[0], inv.map(x => x.item_id), Object.fromEntries(ua.map(x => [x.achievement_id, Date.parse(x.unlocked_at)])));
}
const patchNickname = n => call('/rest/v1/profiles?id=eq.' + myId, { method: 'PATCH', body: JSON.stringify({ nickname: String(n).trim().slice(0, 16) }) });

async function init() {
  if (!configured() || !initDataRaw()) return false;
  try { await login(); await rpc('touch_visit'); await syncAll(); try { const ov = await rpc('collection_overview'); for (const it of ov.items) if (['frame', 'bg', 'skin'].includes(it.kind) && !S.SHOP.some(x => x.id === it.id)) S.SHOP.push({ id: it.id, kind: it.kind, name: it.name, c: [it.c1, it.c2], price: it.price, cur: it.currency, hue: it.hue ?? undefined, season: true }); } catch {} return true; }
  catch (e) { lastErr = String(e.message || e); token = null; if (/not_subscribed|check_failed/.test(lastErr)) return 'locked'; console.warn('Online mode unavailable, staying in demo mode:', e.message); return false; }
}

const lastError = () => lastErr;
Object.assign(__exp, { configured, online, myProfileId, friendly, rpc, call, syncAll, patchNickname, init, lastError });

      return !was;
    }
    if (accepted()) await pushToServer();   // accepted in the app earlier (e.g. before login) → record on the server now
  } catch (e) { console.warn('terms check failed', e.message); }

}

// ---------- payment: the server creates the order + invoice; Telegram takes the Stars; the server fulfills; we only wait and look ----------
async function pay(arg) {
  if (!inTelegram) { toast('Оплата Stars доступна только внутри Telegram'); return 'unsupported'; }
  const r = await api.call('/functions/v1/stars-invoice', { method: 'POST', body: JSON.stringify(arg) });
  const st = await openInvoice(r.invoice_link);
  if (st !== 'paid') return st;
  haptic('success'); toast('Оплата прошла, выдаём покупку…');
  for (let i = 0; i < 14; i++) {
    await new Promise(x => setTimeout(x, 1500));
    let o = null; try { o = (await R('stars_my_orders', { p_limit: 5 })).find(x => x.id === r.order_id); } catch {}
    if (o && ['fulfilled', 'refunded', 'failed'].includes(o.status)) { try { await api.syncAll(); } catch {} return o.status === 'fulfilled' ? 'done' : o.status; }
  }
  try { await api.syncAll(); } catch {}
  return 'pending';
}
const afterPay = st => {
  if (st === 'done') { sfx('reward'); confetti(document.body, 60); toast('Покупка получена!'); }
  else if (st === 'pending') toast('Оплата принята. Награда появится в течение минуты.');
  else if (st === 'cancelled') toast('Оплата отменена');
  else if (st === 'failed' || st === 'refunded') toast('Платёж не прошёл или возвращён. Если списались Stars, напишите /paysupport');
  return st === 'done' || st === 'pending';
};

// ---------- profile card (inserted into the profile page) ----------
async function profileCard(box) {
  if (!box || !api.online()) return;
  try {
    const [v, pm] = await Promise.all([R('vip_overview'), R('season_premium_overview').catch(() => null)]);
    const prem = pm && pm.premium && pm.premium.owned, cal = v.calendar && v.calendar.status === 'active';
    if (!(v.vip_active || prem || cal || v.has_frame)) return;
    box.innerHTML = `<div class="card pbanner" style="margin-top:12px">${v.vip_active && v.show_badge ? `<div class="row between"><b>VIP</b><span class="chip" style="color:var(--gold)">Активен${v.vip_ends_at ? ' до ' + fmt(v.vip_ends_at).split(',')[0] : ''}</span></div>` : ''}
      ${prem ? '<div class="row between" style="margin-top:6px"><b>PREMIUM PASS</b><span class="chip" style="color:var(--gold)">Этот сезон</span></div>' : ''}
      ${v.has_frame ? '<div class="muted" style="font-size:12px;margin-top:6px">Рамка VELORA VIP в инвентаре</div>' : ''}
      ${cal ? '<a class="btn sm block" href="#/stars/vip" style="display:grid;place-items:center;text-decoration:none;margin-top:8px">VIP календарь</a>' : ''}</div>`;
  } catch {}
}

const fld = (id, label, val = '', type = 'text') => `<label class="muted" style="font-size:12px;display:block;margin-top:8px">${label}</label><input class="v2in" id="${id}" type="${type}" value="${esc(val ?? '')}">`;
const chk = (id, label, on) => `<label class="v2chk"><input type="checkbox" id="${id}" ${on ? 'checked' : ''}> ${label}</label>`;
const sel = (id, label, opts, cur) => `<label class="muted" style="font-size:12px;display:block;margin-top:8px">${label}</label><select class="v2in" id="${id}">${opts.map(o => `<option value="${esc(o[0])}" ${o[0] === cur ? 'selected' : ''}>${esc(o[1])}</option>`).join('')}</select>`;
const V = (m, id) => m.querySelector('#' + id).value, C = (m, id) => m.querySelector('#' + id).checked;
const N = (m, id) => { const v = V(m, id).trim(); return v === '' ? null : +v; };
const iso = (m, id) => { const v = V(m, id); return v ? new Date(v).toISOString() : null; };
const local = d => d ? new Date(new Date(d).getTime() - new Date().getTimezoneOffset() * 6e4).toISOString().slice(0, 16) : '';
const KINDS = [['currency', 'Валюта'], ['item', 'Предмет'], ['bundle', 'Набор'], ['vip_bundle', 'VIP набор'], ['premium_pass', 'Premium (из сезона)']];
const RARS = Object.entries(RAR).map(([k, v]) => [k, v[0]]);
const pargs = p => ({ p_id: p.id, p_category: p.category, p_kind: p.kind, p_name: p.name, p_description: p.description || '', p_image_url: p.image_url || null, p_rarity: p.rarity, p_price: p.price_stars,
  p_payload: p.payload || {}, p_active: p.active, p_repeatable: p.repeatable, p_max_per_user: p.max_per_user ?? null, p_stock: p.stock ?? null, p_starts: p.starts_at || null, p_ends: p.ends_at || null, p_sort: p.sort ?? 100 });
