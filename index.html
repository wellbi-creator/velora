<!doctype html>
<html lang="ru" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#080B18">
<title>VELORA</title>
<style>
/* VELORA design system */
:root{
  --bg:#080B18; --bg2:#10162A; --p:#8B5CF6; --p2:#A78BFA; --cyan:#42D9E8; --blue:#477BFF;
  --text:#F5F5FF; --text2:#9BA5C7; --card:rgba(24,30,58,.62); --line:rgba(167,139,250,.18);
  --ok:#4ADE80; --bad:#FB7185; --gold:#FBBF24;
  --r-s:12px; --r-m:18px; --r-l:26px; --sp:16px;
  --shadow:0 10px 30px rgba(0,0,0,.35); --glow:0 0 24px rgba(139,92,246,.45);
  --sat:env(safe-area-inset-top,0px); --sab:env(safe-area-inset-bottom,0px);
  --nav-h:68px;
}
[data-theme="light"]{
  --bg:#F2F3FF; --bg2:#E4E7FA; --text:#12163A; --text2:#566089; --card:rgba(255,255,255,.8);
  --line:rgba(99,102,241,.2); --shadow:0 10px 26px rgba(70,80,160,.18); --glow:0 0 22px rgba(139,92,246,.25);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;overflow-x:hidden;background:var(--bg);color:var(--text);
  font:16px/1.4 -apple-system,"SF Pro Text","Segoe UI",Roboto,system-ui,sans-serif;touch-action:manipulation;overscroll-behavior:none}
#bg{position:fixed;inset:0;z-index:-1;
  background:radial-gradient(900px 500px at 85% -10%,rgba(139,92,246,.35),transparent 60%),
  radial-gradient(700px 500px at -10% 40%,rgba(66,217,232,.18),transparent 60%),
  linear-gradient(180deg,var(--bg),var(--bg2))}
#view{min-height:100%;padding:calc(var(--sat) + 14px) var(--sp) calc(var(--nav-h) + var(--sab) + 24px);max-width:640px;margin:0 auto;animation:fade .35s ease}
#view.nonav{padding-bottom:calc(var(--sab) + 24px)}
@keyframes fade{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
h1{font-size:26px;margin:0 0 4px;letter-spacing:-.3px} h2{font-size:19px;margin:22px 0 10px} h3{font-size:17px;margin:0}
p{margin:0 0 8px} .muted{color:var(--text2)} .row{display:flex;align-items:center;gap:12px} .between{justify-content:space-between}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px} .center{text-align:center}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r-l);padding:16px;box-shadow:var(--shadow);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px)}
.card+.card{margin-top:12px}
.btn{appearance:none;border:0;cursor:pointer;font:600 16px inherit;font-family:inherit;color:#fff;min-height:48px;padding:0 20px;border-radius:var(--r-m);
  background:linear-gradient(135deg,var(--p),var(--blue));box-shadow:var(--glow);transition:transform .12s,filter .2s}
.btn:active{transform:scale(.96)} .btn:disabled{opacity:.45;filter:grayscale(.5);cursor:not-allowed}
.btn.ghost{background:transparent;border:1px solid var(--line);color:var(--text);box-shadow:none}
.btn.cyan{background:linear-gradient(135deg,var(--cyan),var(--blue))} .btn.block{width:100%}
.btn.sm{min-height:40px;padding:0 14px;font-size:14px}
.chip{display:inline-flex;align-items:center;gap:6px;padding:6px 12px;border-radius:99px;background:var(--card);border:1px solid var(--line);font-weight:600;font-size:14px}
.badge{font-size:12px;padding:3px 8px;border-radius:99px;background:rgba(251,191,36,.16);color:var(--gold);font-weight:600}
.bar{height:10px;border-radius:99px;background:rgba(155,165,199,.2);overflow:hidden}
.bar>i{display:block;height:100%;border-radius:inherit;background:linear-gradient(90deg,var(--cyan),var(--p));transition:width .5s}
.top{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:14px}
.avatar{width:48px;height:48px;border-radius:50%;display:grid;place-items:center;font-weight:700;font-size:20px;
  background:linear-gradient(135deg,var(--p),var(--cyan));border:2px solid var(--p2);box-shadow:var(--glow);color:#fff}
.icon{width:24px;height:24px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex:none}
.icon.fill{fill:currentColor;stroke:none}
#nav{position:fixed;left:0;right:0;bottom:0;z-index:20;display:flex;justify-content:space-around;padding:8px 8px calc(var(--sab) + 8px);
  background:rgba(12,16,34,.82);border-top:1px solid var(--line);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px)}
[data-theme="light"] #nav{background:rgba(255,255,255,.85)}
#nav.hidden{display:none}
#nav a{flex:1;max-width:110px;display:flex;flex-direction:column;align-items:center;gap:2px;padding:6px 0;border-radius:14px;color:var(--text2);text-decoration:none;font-size:12px;font-weight:600;transition:.2s}
#nav a.on{color:var(--cyan);background:rgba(139,92,246,.18)}
.game{display:flex;gap:14px;align-items:center;cursor:pointer;position:relative;overflow:hidden}
.game .gi{width:56px;height:56px;border-radius:16px;display:grid;place-items:center;color:#fff;flex:none}
.game[aria-disabled="true"]{opacity:.55;cursor:default}
.opt{display:block;width:100%;text-align:left;margin-top:10px;padding:14px 16px;min-height:52px;border-radius:var(--r-m);border:1px solid var(--line);background:var(--card);color:var(--text);font:600 16px inherit;font-family:inherit;cursor:pointer;transition:.15s}
.opt:active{transform:scale(.98)} .opt.ok{background:rgba(74,222,128,.22);border-color:var(--ok)} .opt.bad{background:rgba(251,113,133,.22);border-color:var(--bad)}
.tabs{display:flex;gap:8px;overflow-x:auto;padding-bottom:4px;scrollbar-width:none} .tabs::-webkit-scrollbar{display:none}
.mem{display:grid;gap:10px}
.tile{aspect-ratio:1;border-radius:16px;border:1px solid var(--line);background:linear-gradient(145deg,#1b2245,#10162A);display:grid;place-items:center;cursor:pointer;transition:transform .3s;color:transparent}
.tile.open,.tile.done{background:var(--card);transform:rotateY(0)} .tile.done{border-color:var(--ok);box-shadow:0 0 14px rgba(74,222,128,.4)}
.key{min-width:34px;height:44px;border-radius:10px;border:1px solid var(--line);background:var(--card);color:var(--text);font:700 16px inherit;font-family:inherit}
.key:disabled{opacity:.3}
.keys{display:flex;flex-wrap:wrap;gap:6px;justify-content:center;margin-top:14px}
.word{display:flex;gap:8px;justify-content:center;margin:18px 0}
.word b{width:34px;height:44px;border-bottom:3px solid var(--p2);display:grid;place-items:center;font-size:24px}
.reactpad{height:280px;border-radius:var(--r-l);display:grid;place-items:center;font-size:22px;font-weight:700;text-align:center;padding:16px;user-select:none;transition:background .1s}
.modal-bg{position:fixed;inset:0;background:rgba(0,0,0,.6);z-index:50;display:grid;place-items:end center;animation:fade .2s}
.sheet{width:100%;max-width:640px;background:var(--bg2);border-radius:var(--r-l) var(--r-l) 0 0;padding:20px 16px calc(var(--sab) + 20px);border:1px solid var(--line)}
#toast{position:fixed;left:50%;top:calc(var(--sat) + 14px);transform:translate(-50%,-80px);z-index:60;background:var(--bg2);border:1px solid var(--p2);padding:10px 18px;border-radius:99px;font-weight:600;transition:transform .35s;max-width:90%}
#toast.show{transform:translate(-50%,0)}
.lumi{animation:float 3.6s ease-in-out infinite} @keyframes float{50%{transform:translateY(-8px)}}
.seg{display:flex;background:var(--card);border:1px solid var(--line);border-radius:99px;padding:4px;gap:4px}
.seg button{flex:1;min-height:40px;border:0;border-radius:99px;background:none;color:var(--text2);font:600 14px inherit;font-family:inherit}
.seg button.on{background:linear-gradient(135deg,var(--p),var(--blue));color:#fff}
input[type=range]{width:100%;accent-color:var(--p)}
input[type=text]{width:100%;min-height:48px;border-radius:var(--r-m);border:1px solid var(--line);background:var(--card);color:var(--text);padding:0 14px;font:16px inherit;font-family:inherit}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
.tile2{display:flex;flex-direction:column;align-items:center;gap:6px;margin:0!important;padding:14px 8px;text-decoration:none;color:var(--text);transition:transform .15s}
.tile2:active{transform:scale(.96)} .tile2 .icon{width:30px;height:30px;color:var(--cyan)}
.hero{border-color:rgba(167,139,250,.35);box-shadow:0 14px 40px rgba(139,92,246,.3)}
.game{transition:transform .15s,box-shadow .2s} .game:active{transform:scale(.98)}
.card.game{background:linear-gradient(135deg,rgba(139,92,246,.18),rgba(24,30,58,.7))}
#nav a.on{box-shadow:0 0 18px rgba(139,92,246,.45) inset}
#nav a.on .icon{filter:drop-shadow(0 0 6px var(--cyan))}
.shopitem{transition:transform .15s} .shopitem:active{transform:scale(.97)}
.btn{background-size:200% 100%;position:relative;overflow:hidden}
.btn:not(.ghost)::after{content:"";position:absolute;inset:0;background:linear-gradient(105deg,transparent 40%,rgba(255,255,255,.25) 50%,transparent 60%);transform:translateX(-120%);animation:shine 4s infinite}
@keyframes shine{60%,100%{transform:translateX(120%)}}
button.chip{color:var(--text);font-family:inherit;cursor:pointer}
.podium{display:flex;align-items:flex-end;justify-content:center;gap:8px;margin:18px 0 14px;padding:8px 0 0;background:radial-gradient(260px 120px at 50% 100%,rgba(139,92,246,.35),transparent 70%)}
.pl{flex:1;max-width:120px;display:flex;flex-direction:column;align-items:center;gap:4px}
.pav{width:54px;height:54px;border-radius:50%;display:grid;place-items:center;font-weight:700;font-size:22px;background:#1b2245;border:3px solid var(--p2);box-shadow:var(--glow);color:#fff}
.pl.p1 .pav{width:66px;height:66px;font-size:26px;border-color:var(--gold)}
.pn{font-size:13px;font-weight:600;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pb{width:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;border-radius:12px 12px 0 0;background:linear-gradient(180deg,#232b55,#10162A);border-top:4px solid var(--p);box-shadow:0 -6px 20px rgba(139,92,246,.35)}
.pb i{font-style:normal;font-size:34px;font-weight:800;color:var(--p2)} .pb small{color:var(--text2);font-size:12px;margin-bottom:6px}
.p1 .pb{height:120px}.p2 .pb{height:92px}.p3 .pb{height:72px}
.chip{white-space:nowrap}
/* ---- results & intro polish ---- */
.intro-hero{text-align:center;padding-top:6px}
.intro-cover{display:inline-block;filter:drop-shadow(0 12px 28px rgba(139,92,246,.55));animation:float 4s ease-in-out infinite;margin-bottom:8px}
.res{position:relative}
.res-glow{position:absolute;left:50%;top:-10px;width:300px;height:300px;margin-left:-150px;border-radius:50%;background:radial-gradient(circle,rgba(139,92,246,.35),transparent 65%);z-index:-1;animation:pulse 3s ease-in-out infinite}
.res-glow.w{background:radial-gradient(circle,rgba(251,191,36,.38),transparent 65%)}
@keyframes pulse{50%{transform:scale(1.12);opacity:.7}}
.ring{position:relative;display:grid;place-items:center}
.ring svg{position:absolute;inset:0;filter:drop-shadow(0 0 10px rgba(66,217,232,.45))}
.ring-arc{animation:arc 1.2s .15s cubic-bezier(.2,.8,.2,1) forwards}
@keyframes arc{to{stroke-dashoffset:var(--to)}}
.ring-t{position:relative;display:flex;flex-direction:column;line-height:1.1}.ring-t b{font-size:30px}.ring-t span{font-size:12px;color:var(--text2)}
.rv{font-size:26px;background:linear-gradient(135deg,var(--cyan),var(--p2));-webkit-background-clip:text;background-clip:text;color:transparent}
.res-r>div{animation:pop .5s both}.res-r>div+div{animation-delay:.12s}
@keyframes pop{from{opacity:0;transform:scale(.7)}to{opacity:1;transform:none}}
.lvl-up{animation:pop .6s .6s both,shine2 2s 1s infinite}@keyframes shine2{50%{box-shadow:0 0 18px rgba(251,191,36,.6)}}
.confetti{position:fixed;inset:0;pointer-events:none;overflow:hidden;z-index:50}
.confetti i{position:absolute;top:-20px;border-radius:2px;animation:fall linear forwards}
@keyframes fall{to{transform:translate(var(--dx),105vh) rotate(var(--r));opacity:.9}}
@media (prefers-reduced-motion:reduce){.confetti,.res-glow,.intro-cover,.lumi{animation:none!important}}
/* ---- game screens ---- */
.opt{display:flex;align-items:center;gap:12px;animation:slideIn .4s both;transition:transform .15s,background .2s,border-color .2s}
@keyframes slideIn{from{opacity:0;transform:translateX(-18px)}to{opacity:1;transform:none}}
.ol{flex:none;width:30px;height:30px;border-radius:10px;display:grid;place-items:center;font-size:14px;font-weight:800;background:linear-gradient(135deg,var(--p),var(--blue));color:#fff}
.opt.ok .ol{background:var(--ok)}.opt.bad .ol{background:var(--bad)}
.opt.ok{animation:okpulse .5s}.opt.bad{animation:shake .4s}
@keyframes okpulse{40%{transform:scale(1.03);box-shadow:0 0 22px rgba(74,222,128,.55)}}
@keyframes shake{25%{transform:translateX(-7px)}75%{transform:translateX(7px)}}
#tb.low{background:linear-gradient(90deg,var(--bad),var(--gold))}
.combo{color:var(--gold);font-weight:700}
.tile{position:relative;perspective:600px;background:linear-gradient(145deg,#2a2468,#141a3a)}
.tile::before{content:"";position:absolute;inset:0;border-radius:inherit;opacity:.5;background:radial-gradient(circle at 50% 50%,rgba(66,217,232,.5) 0 3px,transparent 4px),repeating-linear-gradient(45deg,transparent 0 8px,rgba(167,139,250,.14) 8px 9px)}
.tile.open::before,.tile.done::before{display:none}
.tile.flip{animation:flip .35s ease}
@keyframes flip{from{transform:rotateY(90deg) scale(.9)}to{transform:none}}
.tile.done{animation:matched .5s}
@keyframes matched{40%{transform:scale(1.14)}}
.reactpad{position:relative;overflow:hidden;box-shadow:inset 0 0 60px rgba(0,0,0,.35)}
.reactpad[data-s=go]{animation:gopulse .5s infinite alternate;font-size:34px}
.reactpad[data-s=hit]{font-size:44px}
.reactpad[data-s=foul]{animation:shake .4s}
@keyframes gopulse{to{box-shadow:inset 0 0 90px rgba(255,255,255,.4)}}
.rip{position:absolute;width:20px;height:20px;margin:-10px;border-radius:50%;border:3px solid #fff;pointer-events:none;animation:rip .7s ease-out forwards}
@keyframes rip{to{transform:scale(18);opacity:0}}
/* ---- shop & world ---- */
.tryon{position:relative;display:flex;align-items:center;justify-content:center;gap:18px;border-radius:var(--r-l);padding:16px;margin-bottom:12px;overflow:hidden;border:1px solid var(--line);box-shadow:var(--shadow)}
.tryon-glow{position:absolute;inset:0;background:radial-gradient(200px 120px at 50% 100%,rgba(255,255,255,.25),transparent 70%)}
.tryon>*{position:relative}
.shopitem{position:relative}
.rtag{position:absolute;top:8px;left:8px;font-size:11px;font-weight:700;padding:2px 8px;border-radius:99px;background:rgba(155,165,199,.2);color:var(--text2)}
.r-rare{border-color:var(--cyan);box-shadow:0 0 16px rgba(66,217,232,.3)}.r-rare .rtag{background:rgba(66,217,232,.18);color:var(--cyan)}
.r-epic{border-color:var(--p2);box-shadow:0 0 22px rgba(167,139,250,.5);background:linear-gradient(160deg,rgba(139,92,246,.28),var(--card))}.r-epic .rtag{background:rgba(167,139,250,.25);color:var(--p2)}
.terr.open{border-color:rgba(66,217,232,.45);box-shadow:0 0 22px rgba(66,217,232,.18)}
.dq{background:linear-gradient(135deg,rgba(251,191,36,.16),var(--card))}
/* ---- multiplayer ---- */
.roomcode{font-size:44px;font-weight:800;letter-spacing:10px;margin:6px 0;background:linear-gradient(135deg,var(--cyan),var(--p2));-webkit-background-clip:text;background-clip:text;color:transparent;cursor:pointer;padding-left:10px}
.slots{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.slot{display:flex;flex-direction:column;align-items:center;gap:6px;padding:14px 8px;border-radius:var(--r-m);border:1px dashed var(--line);text-align:center;min-height:112px;justify-content:center}
.slot.on{border-style:solid;background:var(--card)}
.pav.pulse{animation:pulse 1.6s ease-in-out infinite;opacity:.6}
.vs{padding-top:30px}.vsrow{display:flex;align-items:center;justify-content:space-around;margin:28px 0}
.vsp{display:flex;flex-direction:column;align-items:center;gap:6px;margin-bottom:10px;animation:pop .6s both}
.vsx{font-size:44px;font-weight:900;background:linear-gradient(135deg,var(--gold),var(--bad));-webkit-background-clip:text;background-clip:text;color:transparent;animation:pop .8s .3s both}
.sb{padding:10px 14px}
.sbrow{display:flex;align-items:center;gap:8px;padding:4px 0}.sbrow.me .sbn{font-weight:700}
.sbn{min-width:64px;max-width:90px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:14px}
.dot{width:10px;height:10px;border-radius:50%;flex:none}

</style>

<body>
<div id="bg" aria-hidden="true"></div>
<main id="view"></main>
<nav id="nav" aria-label="Основная навигация"></nav>
<div id="modal"></div>
<div id="toast" role="status"></div>
<script>
(() => {
const __m = {};
__m["services/telegram"] = (() => {
const __exp = {};
// Telegram Mini Apps wrapper with safe browser fallback.
// NOTE: user data from initDataUnsafe is for display only. Server must verify initData (see supabase/functions, stage 7).
const tg = window.Telegram?.WebApp;
const inTelegram = !!(tg && tg.initData);

function initTelegram() {
  if (!tg) return;
  try {
    tg.ready(); tg.expand();
    tg.setHeaderColor?.('#080B18'); tg.setBackgroundColor?.('#080B18');
    tg.disableVerticalSwipes?.();
  } catch (e) { console.warn('tg init', e); }
}

function tgUser() {
  const u = tg?.initDataUnsafe?.user;
  return u ? { id: String(u.id), name: u.first_name || u.username || 'Игрок' } : null;
}
function tgColorScheme() { return inTelegram ? tg.colorScheme : null; }
function startParam() { return tg?.initDataUnsafe?.start_param || new URLSearchParams(location.search).get('start') || ''; }

function haptic(type = 'light') {
  try {
    const h = tg?.HapticFeedback; if (!h) return;
    if (type === 'success' || type === 'error' || type === 'warning') h.notificationOccurred(type);
    else h.impactOccurred(type);
  } catch {}
}

let backHandler = null;
function setBack(fn) {
  const bb = tg?.BackButton;
  if (backHandler && bb) bb.offClick(backHandler);
  backHandler = fn;
  if (!bb) return;
  if (fn) { bb.onClick(fn); bb.show(); } else bb.hide();
}
const initDataRaw = () => tg?.initData || '';

Object.assign(__exp, { inTelegram, initTelegram, tgUser, tgColorScheme, startParam, haptic, setBack, initDataRaw });
return __exp;
})();

__m["services/store"] = (() => {
const __exp = {};
// Local demo store. In production all balances/XP are computed server-side (Supabase RPC) — see README.
const KEY = 'velora.v1';
const day = () => new Date().toISOString().slice(0, 10);

const def = () => ({
  id: 'V-' + Math.random().toString(36).slice(2, 8).toUpperCase(),
  nick: 'Игрок', created: Date.now(), xp: 0, coins: 100, crystals: 5,
  streak: 0, lastVisit: '', history: [], stats: {}, claimed: {}, daily: {},
  settings: { music: false, sfx: true, volume: 0.6, theme: 'dark' }
});

let s;
try { s = { ...def(), ...JSON.parse(localStorage.getItem(KEY) || '{}') }; } catch { s = def(); }
s.settings = { ...def().settings, ...s.settings };
const subs = new Set();
const save = () => { try { localStorage.setItem(KEY, JSON.stringify(s)); } catch {} subs.forEach(f => f()); };

const state = () => s;
const onChange = f => { subs.add(f); return () => subs.delete(f); };
const need = lvl => 100 + (lvl - 1) * 50;
function levelInfo() {
  let xp = s.xp, lvl = 1;
  while (xp >= need(lvl)) { xp -= need(lvl); lvl++; }
  return { level: lvl, cur: xp, max: need(lvl), pct: Math.round(xp / need(lvl) * 100) };
}
function setNick(n) { n = String(n).trim().slice(0, 16); if (n) { s.nick = n; save(); } }
function setSetting(k, v) { s.settings[k] = v; save(); }

function touchVisit() {
  const t = day();
  if (s.lastVisit === t) return;
  const y = new Date(Date.now() - 864e5).toISOString().slice(0, 10);
  s.streak = s.lastVisit === y ? s.streak + 1 : 1;
  s.lastVisit = t; save();
}

function playedToday() { return s.daily[day()]?.played || 0; }
const DAILY = { goal: 3, coins: 50, crystals: 1 };
const dailyClaimed = () => !!s.claimed[day()];
function claimDaily() {
  if (dailyClaimed() || playedToday() < DAILY.goal) return false;
  s.claimed[day()] = true; s.coins += DAILY.coins; s.crystals += DAILY.crystals; save(); return true;
}

// Reward formula (demo). Capped per game so clients cannot inflate it once moved to server.
function recordGame({ mode, score, max, win, diff }) {
  const mult = { easy: 1, normal: 1.5, hard: 2 }[diff] || 1;
  const ratio = max ? Math.min(1, score / max) : 0;
  const xp = Math.round((10 + 30 * ratio) * mult);
  const coins = win ? Math.round(10 * mult + 10 * ratio) : Math.round(3 * ratio);
  const before = levelInfo().level;
  s.xp += xp; s.coins += coins;
  const lvlUp = levelInfo().level > before;
  if (lvlUp) s.coins += 25;
  const st = (s.stats[mode] ||= { played: 0, wins: 0, best: 0 });

      const tb = el.querySelector('#tb'); if (tb) { tb.style.width = left / TIME * 100 + '%'; tb.classList.toggle('low', left <= 4); }

    }, 1000);
  };
  const doneScreen = st => {
    view = 'done'; clearInterval(timer);
    el.innerHTML = `<div class="center">${lumi('thinking', 110)}<h1>Ты закончил!</h1><p class="muted">Ждём остальных игроков…</p></div><div class="card sb" id="sb">${board(st)}</div>`;
  };

  // ---------- result ----------
  const result = st => {
    if (view === 'result') return; view = 'result'; clearInterval(timer); clearInterval(poll);
    const m = me(st), win = st.winner_team === m.team, draw = st.winner_team === -1;
    sfx(win ? 'win' : 'lose'); haptic(win ? 'success' : 'warning'); if (win) setTimeout(() => confetti(document.body, 60), 200);
    const sorted = [...st.players].sort((a, b) => b.score - a.score);
    el.innerHTML = `<div class="center res"><div class="res-glow ${win ? 'w' : ''}"></div>${lumi(win ? 'victory' : draw ? 'happy' : 'thinking', 130)}
      <h1>${draw ? 'Ничья!' : win ? 'Победа!' : 'Поражение'}</h1>
      ${team ? `<p><b style="color:${TEAM_COLOR[0]}">${TEAM_NAME[0]} ${st.team_scores[0]}</b> : <b style="color:${TEAM_COLOR[1]}">${st.team_scores[1]} ${TEAM_NAME[1]}</b></p>` : ''}</div>
      <div class="card">${sorted.map((p, i) => `<div class="sbrow ${p.me ? 'me' : ''}" style="padding:8px 0"><b style="width:22px">${i + 1}</b><span class="dot" style="background:${TEAM_COLOR[p.team]}"></span><span class="sbn">${esc(p.me ? 'Ты' : p.nick)}</span><b>${p.score}</b></div>`).join('')}</div>
      <p class="muted center" style="margin-top:10px">Награды за онлайн-матчи пока не начисляются.</p>
      <button class="btn block" id="again" style="margin-top:12px">В лобби</button>
      <a class="btn ghost block" href="#/games" style="display:grid;place-items:center;text-decoration:none;margin-top:10px">Все игры</a>`;
    el.querySelector('#again').onclick = lobby;
  };

  // resume a match that is already running (app was closed), otherwise show the lobby
  lobby();
  api.rpc('mp_current').then(id => { if (id && alive && view === 'lobby') enter(id); }).catch(() => {});
  return stop;
}
